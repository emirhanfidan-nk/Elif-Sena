<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elif Sena</title>
<meta name="theme-color" content="#FF9EBB">
<meta name="description" content="Elif Sena için ders çalışma uygulaması">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elif Sena">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}

/* Yerleşim: tek sütun telefon uygulaması, altta 5 sekmeli menü. Kartlar kalın çerçeveli çıkartmalar gibi, sert gölgeli. */
:root{
  --h:335;
  --bg:hsl(var(--h) 85% 96%);
  --card:#ffffff;
  --fg:hsl(285 30% 20%);
  --muted:hsl(285 14% 42%);
  --line:hsl(285 32% 27%);
  --shadow:hsl(285 32% 27%);
  --accent:hsl(var(--h) 92% 72%);
  --accent-soft:hsl(var(--h) 100% 92%);
  --accent-deep:hsl(var(--h) 60% 34%);
  --on-accent:hsl(285 40% 16%);
  --good:#2E9E6A;
  --warn:#D6343B;
  --pastel-ink:#3A2742;
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Trebuchet MS',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:hsl(var(--h) 24% 11%);
    --card:hsl(var(--h) 18% 18%);
    --fg:hsl(300 40% 94%);
    --muted:hsl(290 14% 72%);
    --line:hsl(var(--h) 24% 46%);
    --shadow:hsl(285 40% 5%);
    --accent:hsl(var(--h) 80% 68%);
    --accent-soft:hsl(var(--h) 34% 25%);
    --accent-deep:hsl(var(--h) 90% 82%);
    --on-accent:hsl(285 45% 12%);
    --good:#5ED39A;
    --warn:#FF7479;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:hsl(var(--h) 24% 11%);
  --card:hsl(var(--h) 18% 18%);
  --fg:hsl(300 40% 94%);
  --muted:hsl(290 14% 72%);
  --line:hsl(var(--h) 24% 46%);
  --shadow:hsl(285 40% 5%);
  --accent:hsl(var(--h) 80% 68%);
  --accent-soft:hsl(var(--h) 34% 25%);
  --accent-deep:hsl(var(--h) 90% 82%);
  --on-accent:hsl(285 45% 12%);
  --good:#5ED39A;
  --warn:#FF7479;
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;min-height:100%;
  background-color:var(--bg);
  background-image:radial-gradient(var(--accent-soft) 2px,transparent 2.6px);
  background-size:26px 26px;
  color:var(--fg);
  font-family:var(--font-body);font-weight:600;font-size:16px;line-height:1.4;
  padding-block:14px calc(100px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3,.disp{font-family:var(--font-display);font-weight:800;line-height:1.1;text-wrap:balance}
h1{font-size:28px}
h2{font-size:23px}
h3{font-size:19px}
:focus-visible{outline:3px solid var(--accent-deep);outline-offset:2px;border-radius:12px}
#app{max-width:560px;margin:0 auto}
.ic{flex:none;display:block}

/* kartlar ve düğmeler */
.card{background:var(--card);border:2.5px solid var(--line);border-radius:22px;box-shadow:0 4px 0 var(--shadow);padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.view.enter{animation:rise .38s cubic-bezier(.2,.8,.3,1)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;padding:10px 22px;border-radius:999px;
  background:var(--accent);color:var(--on-accent);
  border:2.5px solid var(--line);box-shadow:0 4px 0 var(--shadow);
  font-family:var(--font-display);font-weight:800;font-size:19px;text-align:center;
  transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.btn.big{width:100%}
.btn.ghost{background:var(--card);color:var(--fg)}
.btn.danger{background:var(--card);color:var(--warn)}
.btn.small{min-height:40px;padding:6px 16px;font-size:16px}
.btn[disabled]{opacity:.5;pointer-events:none}
.ib{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:50%;border:2.5px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--shadow)}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.grow{flex:1}

/* seçiciler */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:6px 14px;
  border-radius:999px;border:2.5px solid var(--line);background:var(--card);
  font-weight:800;font-size:15px;transition:transform .08s;
}
.chip.sel{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--shadow);transform:translateY(-1px)}
.chip[disabled]{opacity:.45;pointer-events:none}
.chip.add{border-style:dashed;color:var(--accent-deep)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:5px;background:var(--accent-soft);border:2.5px solid var(--line);border-radius:999px}
.seg button{min-height:40px;border-radius:999px;font-weight:800;font-size:14px;text-align:center;padding:0 6px}
.seg button.sel{background:var(--card);border:2.5px solid var(--line);box-shadow:0 2px 0 var(--shadow)}
.lbl{display:block;font-family:var(--font-display);font-weight:700;font-size:16px;margin:16px 0 8px;color:var(--accent-deep)}
.hint{color:var(--muted);font-size:14px;margin-bottom:10px}
.inp{
  width:100%;font:inherit;font-weight:700;font-size:17px;padding:12px 14px;border-radius:16px;
  border:2.5px solid var(--line);background:var(--card);color:var(--fg);
}
.inp::placeholder{color:var(--muted);opacity:.8}
.area{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:500;resize:vertical;word-break:break-all}
.shake{animation:shake .4s}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.num{font-family:var(--font-display);font-weight:800;font-size:19px;white-space:nowrap}

/* üst başlık, arkadaş, konuşma balonu */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px}
.date{font-size:14px;color:var(--muted);font-weight:800}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;border:2.5px solid var(--line);background:var(--card);font-size:14px;font-weight:800;white-space:nowrap}
.pill b{font-family:var(--font-display);font-size:17px}
.pill.star{background:#FFE17A;color:var(--pastel-ink)}
.pill.fire{color:var(--warn)}
.friend{display:block;width:100%;height:auto;overflow:visible}
.fbody{animation:bob 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
.ear{transform-box:fill-box;transform-origin:50% 90%}
.ear-l{animation:earl 5s infinite}
.ear-r{animation:earr 5s infinite .4s}
.friend.hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
.hero{display:grid;grid-template-columns:128px minmax(0,1fr);gap:10px;align-items:center;background:var(--accent-soft)}
.fr-btn{display:block;width:100%}
.bubble{position:relative;background:var(--card);border:2.5px solid var(--line);border-radius:20px;padding:12px 14px;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--shadow)}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--card);border-left:2.5px solid var(--line);border-bottom:2.5px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.bar{height:20px;border-radius:999px;border:2.5px solid var(--line);background:var(--accent-soft);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-right:2.5px solid var(--line);border-radius:0 999px 999px 0;transition:width .6s cubic-bezier(.2,.8,.3,1)}
.bar i[style*="width:0%"]{border-right:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:8px 4px;color:var(--muted)}
.empty .friend{width:104px}
.empty p{max-width:30ch;font-weight:700}

/* ruh hali */
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.mood{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:800;padding:8px 2px;border-radius:16px;transition:transform .12s}
.mood:active{transform:scale(.92)}
.mood svg{width:46px;height:46px}

/* dersler ve görevler */
.lesson{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:center}
.lesson time{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--muted);text-align:right}
.lblock{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;border:2.5px solid var(--line);color:var(--pastel-ink);font-weight:800;min-width:0}
.lblock span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border:2.5px solid var(--line);border-radius:18px;box-shadow:0 3px 0 var(--shadow);padding:10px 12px;min-width:0}
.ck{flex:none;width:36px;height:36px;border-radius:50%;border:2.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--on-accent);transition:transform .12s,background .2s}
.ck:active{transform:scale(.88)}
.task.done .ck{background:var(--accent);animation:pop .4s}
.tmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.tt{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.tm{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-style:normal;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;border:2px solid var(--line);color:var(--pastel-ink)}
.tag.plain{background:var(--accent-soft);color:var(--accent-deep)}
.tag.due{background:var(--card);color:var(--fg)}
.tag.due.soon{background:#FFE17A;color:var(--pastel-ink)}
.tag.due.late{background:var(--warn);color:#fff;border-color:var(--warn)}
.exam{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center}
.exam-n{text-align:center;border:2.5px solid var(--line);border-radius:18px;padding:6px 4px;color:var(--pastel-ink)}
.exam-n b{display:block;font-family:var(--font-display);font-size:30px;line-height:1}
.exam-n small{font-weight:800;font-size:12px}
.exam h3{font-size:18px;overflow-wrap:anywhere}
.exam p{font-size:14px;color:var(--muted)}

/* odak sayacı */
.ringbox{position:relative;width:min(100%,280px);margin:4px auto 0;aspect-ratio:1}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .trk{fill:none;stroke:var(--accent-soft);stroke-width:20}
.ringbox .prg{fill:none;stroke:var(--accent);stroke-width:20;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ringbox.brk .prg{stroke:var(--good)}
.ringbox .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#tmTime{font-family:var(--font-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.phase{font-weight:800;font-size:14px;padding:3px 12px;border-radius:999px;border:2.5px solid var(--line);background:var(--accent-soft)}
.ctrl{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.ctrl .btn.main{min-width:170px;font-size:22px;min-height:56px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;margin-top:10px}
.wcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.wcol small{font-size:12px;font-weight:800;color:var(--muted)}
.wcol .v{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;min-height:14px}
.wbar{width:100%;max-width:34px;border:2.5px solid var(--line);border-radius:10px 10px 6px 6px;background:var(--accent);min-height:6px;transition:height .5s}
.wcol.today small{color:var(--accent-deep)}
.wcol.today .wbar{background:#FFE17A}
.sess{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px dashed var(--accent-soft)}
.sess:first-of-type{border-top:0}
.sess .dot{width:18px;height:18px}
.sess span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ders programı */
.tt{--cw:1fr}
.tgrid{display:grid;grid-template-columns:42px repeat(5,minmax(0,1fr));gap:5px}
.tgrid .th{text-align:center;font-family:var(--font-display);font-weight:800;font-size:15px;padding:4px 0;border-radius:12px}
.tgrid .th.today{background:var(--accent);color:var(--on-accent);border:2px solid var(--line)}
.tn{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.tn b{font-family:var(--font-display);font-size:18px}
.tn small{font-size:10px;color:var(--muted);font-weight:800}
.cell{min-height:60px;border-radius:14px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;text-align:center;color:var(--muted);transition:transform .1s}
.cell:active{transform:scale(.94)}
.cell.has{border:2.5px solid var(--line);color:var(--pastel-ink)}
.cell.today:not(.has){border-color:var(--accent-deep);background:var(--accent-soft)}
.cn{font-size:10.5px;font-weight:800;line-height:1.1;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.step .sv{font-family:var(--font-display);font-weight:800;font-size:22px;min-width:84px;text-align:center;font-variant-numeric:tabular-nums}

/* ben sayfası */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{text-align:center;padding:12px 6px}
.stat b{display:block;font-family:var(--font-display);font-size:28px;line-height:1.1}
.stat small{color:var(--muted);font-weight:800;font-size:13px}
.me{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;background:var(--accent-soft)}
.wardrobe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:2.5px solid var(--line);border-radius:18px;background:var(--card);text-align:center;font-size:12px;box-shadow:0 3px 0 var(--shadow)}
.wd .friend{width:72px}
.wd b{font-family:var(--font-display);font-size:14px;line-height:1.1}
.wd small{display:inline-flex;align-items:center;gap:3px;font-weight:800;color:var(--muted)}
.wd.on{background:var(--accent);color:var(--on-accent)}
.wd.on small{color:var(--on-accent)}
.wd.locked{opacity:.6}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bdg{display:flex;align-items:center;gap:10px;padding:10px;border:2.5px solid var(--line);border-radius:18px;background:var(--card)}
.bdg .m{flex:none;width:46px;height:46px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;background:#FFE17A;color:var(--pastel-ink)}
.bdg.lock .m{background:var(--accent-soft);color:var(--muted)}
.bdg b{display:block;font-family:var(--font-display);font-size:15px;line-height:1.1}
.bdg small{font-size:12px;color:var(--muted);font-weight:700;line-height:1.2;display:block}
.bdg.lock{opacity:.7}
.crow{display:flex;align-items:center;gap:12px;padding:8px 0;width:100%}
.crow+.crow{border-top:2px dashed var(--accent-soft)}
.crow .sw{flex:none;width:38px;height:38px;border-radius:12px;border:2.5px solid var(--line);display:grid;place-items:center;color:var(--pastel-ink)}
.crow span.n{flex:1;min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hues{display:flex;gap:10px;flex-wrap:wrap}
.hue{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;color:var(--on-accent)}
.hue.sel{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--line)}
.sw-pick{display:flex;flex-wrap:wrap;gap:10px}
.sw-pick button{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;color:var(--pastel-ink)}
.sw-pick button.sel{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--line)}
.ico-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ico-pick button{height:46px;border-radius:14px;border:2.5px solid var(--line);display:grid;place-items:center;background:var(--card)}
.ico-pick button.sel{background:var(--accent);color:var(--on-accent)}
.toggle{width:62px;height:34px;border-radius:999px;border:2.5px solid var(--line);background:var(--accent-soft);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:var(--card);border:2.5px solid var(--line);transition:transform .2s}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle[aria-pressed="true"]::after{transform:translateX(28px)}

/* karşılama */
.ob{display:flex;flex-direction:column;gap:14px;max-width:460px;margin:0 auto}
.ob .card .friend{width:min(60%,200px);margin:0 auto}
.animals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.an{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:2.5px solid var(--line);border-radius:18px;background:var(--card);font-weight:800;font-size:13px}
.an .friend{width:64px}
.an.sel{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--shadow)}
body.ob-mode #nav{display:none}

/* alt menü */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2.5px solid var(--line);padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
#nav .in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:560px;margin:0 auto}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11.5px;font-weight:800;color:var(--muted);border-radius:16px}
#nav button .pl{display:grid;place-items:center;width:52px;height:32px;border-radius:999px;border:2.5px solid transparent;transition:background .2s}
#nav button.on{color:var(--fg)}
#nav button.on .pl{background:var(--accent);border-color:var(--line);color:var(--on-accent);box-shadow:0 2px 0 var(--shadow)}

/* alttan açılan pencere */
#scrim[hidden]{display:none}
#scrim{position:fixed;inset:0;z-index:50;background:rgba(30,12,40,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
#sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--bg);border:2.5px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));animation:up .3s cubic-bezier(.2,.9,.3,1.05)}
.grab{width:46px;height:5px;border-radius:9px;background:var(--line);opacity:.35;margin:4px auto 10px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-actions{display:flex;gap:10px;margin-top:20px}
.sh-actions .btn.danger{padding:10px 16px}
.celeb{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding-top:6px}
.celeb .friend{width:150px}
.celeb .btn{width:100%}

/* takvim */
.cal{margin-top:12px;background:var(--card);border:2.5px solid var(--line);border-radius:20px;padding:10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-display);font-size:18px;font-weight:800;margin-bottom:6px}
.cal-h .ib{width:36px;height:36px;box-shadow:none}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-w i{font-style:normal;font-size:12px;font-weight:800;color:var(--muted);padding:4px 0}
.cal-d{height:40px;border-radius:12px;font-weight:800;font-size:15px;border:2px solid transparent}
.cal-d.today{border-color:var(--line)}
.cal-d.sel{background:var(--accent);color:var(--on-accent);border-color:var(--line)}

/* bildirim, konfeti, kıvılcım */
#toasts{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--card);color:var(--fg);border:2.5px solid var(--line);box-shadow:0 4px 0 var(--shadow);border-radius:999px;padding:9px 18px;font-weight:800;animation:rise .3s;max-width:90vw}
.toast.out{opacity:0;transition:opacity .35s}
.confetti{position:fixed;inset:0;z-index:55;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:15px;border-radius:3px;animation:fall 3s ease-in forwards}
.spark{position:fixed;z-index:70;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:spark .75s ease-out forwards}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(1.012,.99)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes earl{0%,88%,100%{transform:rotate(0)}93%{transform:rotate(-7deg)}}
@keyframes earr{0%,88%,100%{transform:rotate(0)}93%{transform:rotate(7deg)}}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-16px) rotate(-4deg)}70%{transform:translateY(0) rotate(3deg)}100%{transform:none}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(var(--r,360deg));opacity:.9}}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(120deg);opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-width:380px){
  .hero{grid-template-columns:104px minmax(0,1fr)}
  .exam{grid-template-columns:64px minmax(0,1fr) auto}
  #tmTime{font-size:56px}
}
</style>
</head>
<body><div id="app"></div>
<nav id="nav" aria-label="Menü"></nav>
<div id="scrim" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* ---------- yardımcılar ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ymd=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const diffDays=(a,b)=>Math.round((parseYmd(a)-parseYmd(b))/864e5);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DAYS=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const DAYS_SHORT=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const dayPick=a=>a[Math.floor(Date.now()/864e5)%a.length];
const rnd=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- veri ---------- */
const KEY='elifsena.v1';
const PALETTE=['#FF9EBB','#FFB677','#FFE17A','#9EE3A8','#7DDBD0','#8EC9FF','#B7A6FF','#E7A6F2','#FFA39B','#C5D86D'];
const HUES=[335,270,160,22,200];
const KINDS=['Ödev','Tekrar','Okuma','Proje','Sınav çalışması'];
function fresh(){
  const mk=(name,color,icon)=>({id:uid(),name,color,icon});
  return {v:1,
    profile:{name:'Elif Sena',friend:'tavsan',friendName:'Pamuk',hue:335,goal:60,focus:25,brk:5,stars:0,equipped:{},onboarded:false,sound:true},
    courses:[mk('Türkçe',PALETTE[0],'book'),mk('Matematik',PALETTE[5],'calc'),mk('Fen Bilimleri',PALETTE[3],'flask'),mk('Sosyal Bilgiler',PALETTE[1],'globe'),mk('İngilizce',PALETTE[6],'abc'),mk('Din Kültürü',PALETTE[9],'heart'),mk('Görsel Sanatlar',PALETTE[7],'brush'),mk('Beden Eğitimi',PALETTE[4],'ball')],
    tasks:[],exams:[],sessions:[],moods:{},badges:{},
    tt:{rows:7,start:'08:30',len:40,brk:10,cells:{}},
    timer:{phase:'focus',total:1500,remaining:1500,running:false,endAt:0,course:null,startedAt:0}
  };
}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1){const f=fresh();o.profile=Object.assign(f.profile,o.profile);o.tt=Object.assign(f.tt,o.tt);o.timer=Object.assign(f.timer,o.timer);['courses','tasks','exams','sessions'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=f[k];});o.moods=o.moods||{};o.badges=o.badges||{};return o;}}}catch(e){}
  return null;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load()||fresh();
const ui={tab:'home',tasks:'open',say:''};
const ACT={};
const VIEWS={};
let sheetForm={},sheetCtx=null,courseAfter=null,calYM=null;

const course=id=>S.courses.find(c=>c.id===id);
const courseName=id=>{const c=course(id);return c?c.name:'Genel';};
const minutesOn=d=>S.sessions.filter(s=>s.date===d).reduce((a,s)=>a+s.min,0);
const totalMin=()=>S.sessions.reduce((a,s)=>a+s.min,0);
const cmpDue=(a,b)=>{const x=a.due||'9999',y=b.due||'9999';return x<y?-1:x>y?1:0;};
const openTasks=()=>S.tasks.filter(t=>!t.done).sort(cmpDue);
const todayTasks=()=>S.tasks.filter(t=>!t.done&&t.due&&t.due<=ymd()).sort(cmpDue);
function activityDates(){const a=new Set();S.sessions.forEach(s=>a.add(s.date));S.tasks.forEach(t=>{if(t.doneOn)a.add(t.doneOn);});return a;}
function streak(){const a=activityDates();let d=ymd();if(!a.has(d))d=addDays(d,-1);let n=0;while(a.has(d)){n++;d=addDays(d,-1);}return n;}
function nextExam(){const t=ymd();const l=S.exams.filter(e=>e.date>=t).sort((a,b)=>a.date<b.date?-1:1)[0];return l?Object.assign({days:diffDays(l.date,t)},l):null;}
function slotTime(i){const [h,m]=S.tt.start.split(':').map(Number);let t=h*60+m+i*(S.tt.len+S.tt.brk);return pad(Math.floor(t/60)%24)+':'+pad(t%60);}
const cellKey=(d,r)=>d+'_'+r;

/* ---------- rozetler ---------- */
const BADGES=[
  {id:'first',name:'İlk Adım',desc:'İlk odak turunu bitir',icon:'rocket',ok:()=>S.sessions.length>=1},
  {id:'tasks10',name:'Görev Avcısı',desc:'10 görev tamamla',icon:'check',ok:()=>S.tasks.filter(t=>t.done).length>=10},
  {id:'focus300',name:'Odak Ustası',desc:'Toplam 5 saat çalış',icon:'clock',ok:()=>totalMin()>=300},
  {id:'streak3',name:'Üç Gün',desc:'3 gün üst üste çalış',icon:'flame',ok:()=>streak()>=3},
  {id:'streak7',name:'Bir Hafta',desc:'7 gün üst üste çalış',icon:'flame',ok:()=>streak()>=7},
  {id:'stars100',name:'Yıldız Toplayıcı',desc:'100 yıldız topla',icon:'star',ok:()=>S.profile.stars>=100},
  {id:'planner',name:'Planlı Kız',desc:'Programa 10 ders ekle',icon:'grid',ok:()=>Object.keys(S.tt.cells).length>=10},
  {id:'exam',name:'Sınava Hazır',desc:'Bir sınav tarihi ekle',icon:'calendar',ok:()=>S.exams.length>=1}
];
function checkBadges(){BADGES.forEach(b=>{if(!S.badges[b.id]&&b.ok()){S.badges[b.id]=ymd();toast('Yeni rozet: '+b.name);}});}

function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toasts').appendChild(t);
  setTimeout(()=>t.classList.add('out'),2300);setTimeout(()=>t.remove(),2800);
}
function confetti(){
  const box=document.createElement('div');box.className='confetti';
  for(let i=0;i<46;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'%';p.style.background=rnd(PALETTE);
    p.style.animationDelay=Math.random()*.5+'s';p.style.animationDuration=2.2+Math.random()*1.4+'s';
    p.style.setProperty('--r',(Math.random()*720-360)+'deg');
    box.appendChild(p);
  }
  document.body.appendChild(box);setTimeout(()=>box.remove(),4200);
}
function sparkle(ev){
  if(!ev||ev.clientX==null)return;
  const el=ev.currentTarget||ev.target;let x=ev.clientX,y=ev.clientY;
  if(!x&&!y&&el&&el.getBoundingClientRect){const r=el.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2;}
  for(let i=0;i<7;i++){
    const s=document.createElement('i');s.className='spark';s.style.left=x+'px';s.style.top=y+'px';
    const a=Math.PI*2*i/7+Math.random()*.5,d=28+Math.random()*26;
    s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
    s.style.background=i%2?'#FFD04A':'#FF7AA2';
    document.body.appendChild(s);setTimeout(()=>s.remove(),800);
  }
}
let audioCtx=null;
function beep(){
  if(!S.profile.sound)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    [660,880,1100].forEach((f,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.18;
      o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);
      o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.32);
    });
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([120,60,120]);}catch(e){}
}

function fmtDate(s,short){
  const d=parseYmd(s),t=ymd(),n=diffDays(s,t);
  if(n===0)return 'Bugün';if(n===1)return 'Yarın';if(n===-1)return 'Dün';
  return (short?'':DAYS_SHORT[d.getDay()]+', ')+d.getDate()+' '+MONTHS[d.getMonth()];
}
function dueTag(s){
  if(!s)return '';
  const n=diffDays(s,ymd());
  if(n<0)return `<em class="tag due late">${-n} gün geçti</em>`;
  return `<em class="tag due ${n<=1?'soon':''}">${fmtDate(s)}</em>`;
}
const courseTag=id=>{const c=course(id);return c?`<em class="tag" style="background:${c.color};color:var(--pastel-ink)">${esc(c.name)}</em>`:'';};
function dur(m){const h=Math.floor(m/60),r=m%60;return h?(r?h+' sa '+r+' dk':h+' sa'):m+' dk';}

VIEWS.plan=()=>{
  const ex=ui.plan==='exams',dow=new Date().getDay(),tc=dow>=1&&dow<=5?dow-1:-1;
  let body;
  if(!ex){
    let g='<span></span>'+['Pzt','Sal','Çar','Per','Cum'].map((d,i)=>`<span class="th ${i===tc?'today':''}">${d}</span>`).join('');
    for(let r=0;r<S.tt.rows;r++){
      g+=`<div class="tn"><b>${r+1}</b><small>${slotTime(r)}</small></div>`;
      for(let c=0;c<5;c++){
        const co=course(S.tt.cells[cellKey(c,r)]);
        g+=co?`<button class="cell has ${c===tc?'today':''}" style="background:${co.color}" onclick="ACT.cell(${c},${r})" aria-label="${esc(co.name)}">${ic(co.icon,18)}<span class="cn">${esc(co.name)}</span></button>`
              :`<button class="cell ${c===tc?'today':''}" onclick="ACT.cell(${c},${r})" aria-label="Ders ekle">${ic('plus',18)}</button>`;
      }
    }
    body=`<div class="card"><div class="tgrid">${g}</div></div>
      <button class="btn ghost big" onclick="ACT.ttSettings()">${ic('edit',20)}Saatleri ayarla</button>`;
  }else{
    const t=ymd(),up=S.exams.filter(e=>e.date>=t).sort((a,b)=>a.date<b.date?-1:1),past=S.exams.filter(e=>e.date<t).sort((a,b)=>a.date<b.date?1:-1);
    const row=e=>`<button class="card exam" style="text-align:left" onclick="ACT.examEdit('${e.id}')">${examBadge(e)}<div><h3>${esc(courseName(e.course))}</h3><p>${fmtDate(e.date)}${e.note?' · '+esc(e.note):''}</p></div>${ic('chevR',20)}</button>`;
    body=`<button class="btn big" onclick="ACT.examNew()">${ic('plus',22)}Sınav ekle</button>`+
      (up.length||past.length?`<div class="stack" style="gap:12px">${up.map(row).join('')}${past.length?`<h3 style="margin-top:6px">Geçen sınavlar</h3>`+past.map(row).join(''):''}</div>`
      :`<div class="card empty">${friend(S.profile.friend,'focus',S.profile.equipped)}<p>Yaklaşan sınavını ekle, kaç gün kaldığını ben sayarım.</p></div>`);
  }
  return `<div class="top"><h1>${ex?'Sınavlarım':'Ders programım'}</h1></div><div class="stack">
    <div class="seg"><button class="${!ex?'sel':''}" onclick="ACT.planTab('week')">Haftalık program</button><button class="${ex?'sel':''}" onclick="ACT.planTab('exams')">Sınavlar</button></div>${body}</div>`;
};

/* ---------- eylemler ---------- */
let back=null;
const clone=o=>JSON.parse(JSON.stringify(o));
function commit(){save();render();}
Object.assign(ACT,{
  go(t){ui.tab=t;animateNext=true;render();window.scrollTo(0,0);},
  pet(ev){
    ui.say=rnd(['Hehe, gıdıklandım.','Bugün çok iyi çalışacağız.','Sen harikasın, biliyor musun?','Bir tur odak, sonra biraz oyun.','Hadi, ilk adımı atalım.']);
    const b=$('.bubble');if(b)b.textContent=ui.say;
    const f=$('.hero .friend');if(f){f.classList.remove('hop');void f.getBoundingClientRect();f.classList.add('hop');}
    sparkle(ev);
  },
  mood(id){S.moods[ymd()]=id;ui.say=MOODS.find(m=>m.id===id).say;commit();},
  toggle(id,ev){
    const t=S.tasks.find(x=>x.id===id);if(!t)return;
    t.done=!t.done;
    if(t.done){t.doneOn=ymd();S.profile.stars+=2;sparkle(ev);ui.say='Aferin, bir görev daha bitti.';
      if(todayTasks().length===0&&S.tasks.some(x=>x.doneOn===ymd())){confetti();ui.say='Bugünün işlerinin hepsini bitirdin.';}
    }else{t.doneOn=null;S.profile.stars=Math.max(0,S.profile.stars-2);}
    checkBadges();commit();
  },
  tasksTab(k){ui.tasks=k;render();},
  planTab(k){ui.plan=k;render();},
  /* görev formu */
  taskNew(){F={title:'',course:'',kind:'',due:'',showCal:false};calYM=null;openSheet('task');},
  taskEdit(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;F=Object.assign(clone(t),{showCal:false});calYM=null;openSheet('task');},
  fCourse(id){F.course=id;drawSheet();},
  fKind(k){F.kind=F.kind===k?'':k;drawSheet();},
  fDue(s){F.due=s;F.showCal=false;drawSheet();},
  fCal(){F.showCal=!F.showCal;if(F.showCal)calYM=null;drawSheet();},
  taskSave(){
    if(!(F.title||'').trim()){F.err=true;drawSheet();setTimeout(()=>{F.err=false;},500);const i=$('#tTitle');if(i)i.focus();toast('Önce görevi yaz');return;}
    const o={title:F.title.trim(),course:F.course||'',kind:F.kind||'',due:F.due||''};
    if(F.id){Object.assign(S.tasks.find(x=>x.id===F.id),o);}
    else S.tasks.push(Object.assign({id:uid(),done:false,doneOn:null,made:ymd()},o));
    closeSheet();toast('Görev kaydedildi');commit();
  },
  taskDel(){S.tasks=S.tasks.filter(x=>x.id!==F.id);closeSheet();toast('Görev silindi');commit();},
  /* sınav */
  examNew(){F={course:S.courses[0]?S.courses[0].id:'',note:'',date:''};calYM=null;openSheet('exam');},
  examEdit(id){const e=S.exams.find(x=>x.id===id);if(!e)return;F=clone(e);calYM=null;openSheet('exam');},
  eDate(s){F.date=s;drawSheet();},
  examSave(){
    if(!F.date){toast('Önce bir gün seç');return;}
    const o={course:F.course||'',note:(F.note||'').trim(),date:F.date};
    if(F.id)Object.assign(S.exams.find(x=>x.id===F.id),o);else S.exams.push(Object.assign({id:uid()},o));
    closeSheet();toast('Sınav kaydedildi');checkBadges();commit();
  },
  examDel(){S.exams=S.exams.filter(x=>x.id!==F.id);closeSheet();commit();},
  calNav(n){let [y,m]=calYM;m+=n;if(m<0){m=11;y--;}if(m>11){m=0;y++;}calYM=[y,m];drawSheet();},
  /* ders programı */
  cell(c,r){F={day:c,row:r};openSheet('cell');},
  cellSet(id){
    const k=cellKey(F.day,F.row);if(id)S.tt.cells[k]=id;else delete S.tt.cells[k];
    closeSheet();checkBadges();commit();
  },
  ttSettings(){openSheet('tt');},
  ttStep(k,d){
    const T=S.tt;
    if(k==='rows')T.rows=clamp(T.rows+d,4,9);
    if(k==='len')T.len=clamp(T.len+d,30,60);
    if(k==='brk')T.brk=clamp(T.brk+d,5,20);
    if(k==='start'){const [h,m]=T.start.split(':').map(Number);const v=clamp(h*60+m+d,6*60,11*60);T.start=pad(Math.floor(v/60))+':'+pad(v%60);}
    save();drawSheet();
  },
  /* dersler */
  newCourse(){back={name:cur.name,F:clone(F)};F={name:'',color:rnd(PALETTE),icon:rnd(COURSE_ICONS)};openSheet('course');},
  courseNew(){back=null;F={name:'',color:rnd(PALETTE),icon:rnd(COURSE_ICONS)};openSheet('course');},
  courseEdit(id){const c=course(id);if(!c)return;back=null;F=clone(c);openSheet('course');},
  cColor(c){F.color=c;drawSheet();},
  cIcon(i){F.icon=i;drawSheet();},
  courseSave(){
    if(!(F.name||'').trim()){F.err=true;drawSheet();setTimeout(()=>{F.err=false;},500);const i=$('#cName');if(i)i.focus();toast('Dersin adını yaz');return;}
    let id=F.id;
    if(id){Object.assign(course(id),{name:F.name.trim(),color:F.color,icon:F.icon});}
    else{id=uid();S.courses.push({id,name:F.name.trim(),color:F.color,icon:F.icon});}
    save();
    if(back){
      const b=back;back=null;F=b.F;
      if(b.name==='cell'){ACT.cellSet(id);return;}
      F.course=id;openSheet(b.name);render();return;
    }
    closeSheet();commit();
  },
  courseDel(){
    if(!F.confirm){F.confirm=true;drawSheet();setTimeout(()=>{F.confirm=false;if(cur&&cur.name==='course')drawSheet();},3500);return;}
    const id=F.id;S.courses=S.courses.filter(c=>c.id!==id);
    S.tasks.forEach(t=>{if(t.course===id)t.course='';});S.exams.forEach(e=>{if(e.course===id)e.course='';});
    Object.keys(S.tt.cells).forEach(k=>{if(S.tt.cells[k]===id)delete S.tt.cells[k];});
    if(S.timer.course===id)S.timer.course=null;
    closeSheet();commit();
  },
  /* sayaç */
  tCourse(id){S.timer.course=id||null;commit();},
  tToggle(){
    const T=S.timer;
    if(T.running){T.remaining=Math.max(1,Math.ceil((T.endAt-Date.now())/1000));T.running=false;}
    else{if(T.remaining<=0)T.remaining=T.total;T.endAt=Date.now()+T.remaining*1000;T.running=true;
      try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume();}catch(e){}
      ui.say=T.phase==='focus'?'Odaklanma zamanı. Telefonu bir kenara koy, ben burdayım.':'Mola zamanı. Biraz su iç, gözlerini dinlendir.';}
    commit();
  },
  tReset(){const T=S.timer;T.running=false;T.remaining=T.total;commit();},
  tSkip(){const T=S.timer;T.phase='focus';T.total=S.profile.focus*60;T.remaining=T.total;T.running=false;commit();},
  setFocus(m){S.profile.focus=m;const T=S.timer;T.phase='focus';T.total=m*60;T.remaining=T.total;T.running=false;commit();},
  setBrk(m){S.profile.brk=m;commit();},
  /* kişiselleştirme */
  personal(){openSheet('personal');},
  setName(v){S.profile.name=v.trim()||'Elif Sena';save();},
  setFriendName(v){S.profile.friendName=v.trim()||ANIMALS[S.profile.friend].dn;save();},
  setFriend(k){
    const p=S.profile,prev=ANIMALS[p.friend];
    if(!p.friendName||p.friendName===prev.dn)p.friendName=ANIMALS[k].dn;
    p.friend=k;p.equipped=p.equipped||{};commit();
  },
  setHue(h){S.profile.hue=h;commit();},
  goal(d){S.profile.goal=clamp(S.profile.goal+d,15,240);save();drawSheet();},
  sound(){S.profile.sound=!S.profile.sound;if(S.profile.sound)beep();commit();},
  start(){S.profile.onboarded=true;ui.say='Merhaba! Ben '+S.profile.friendName+'. Birlikte çalışalım.';commit();confetti();},
  wear(id){
    const p=S.profile,it=ITEMS.find(i=>i.id===id);if(!it)return;
    p.owned=p.owned||[];p.equipped=p.equipped||{};
    if(!p.owned.includes(id)){
      if(p.stars<it.cost){toast((it.cost-p.stars)+' yıldız daha lazım');return;}
      p.stars-=it.cost;p.owned.push(id);p.equipped[it.slot]=id;toast(it.name+' senin oldu');confetti();
    }else if(p.equipped[it.slot]===id)delete p.equipped[it.slot];
    else p.equipped[it.slot]=id;
    commit();
  },
  /* yedek */
  backup(){openSheet('backup');},
  copyBk(){
    const ta=$('#bk');ta.focus();ta.select();
    const ok=()=>toast('Kopyalandı');
    try{navigator.clipboard.writeText(ta.value).then(ok,()=>{try{document.execCommand('copy')&&ok();}catch(e){}});}
    catch(e){try{document.execCommand('copy')&&ok();}catch(_){}}
  },
  restore(){
    try{
      const o=JSON.parse(($('#rs').value||'').trim());
      if(!o||o.v!==1||!Array.isArray(o.courses))throw 0;
      const f=fresh();o.profile=Object.assign(f.profile,o.profile);o.tt=Object.assign(f.tt,o.tt);o.timer=Object.assign(f.timer,o.timer);
      ['tasks','exams','sessions'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[];});o.moods=o.moods||{};o.badges=o.badges||{};
      S=o;save();closeSheet();render();toast('Geri yüklendi');
    }catch(e){toast('Kod geçersiz, tekrar kontrol et');}
  }
});

/* ---------- sayaç döngüsü ---------- */
function tickDom(){
  if(ui.tab!=='timer')return;
  const T=S.timer,tm=$('#tmTime'),pr=$('#prg');
  if(tm)tm.textContent=fmtTime(T.remaining);
  if(pr){const C=2*Math.PI*110;pr.style.strokeDashoffset=C*(1-T.remaining/T.total);}
}
function finishTimer(){
  const T=S.timer;T.running=false;beep();
  if(T.phase==='focus'){
    const min=Math.round(T.total/60),stars=Math.max(1,Math.round(min/5));
    S.sessions.push({id:uid(),date:ymd(),min,course:T.course||''});
    S.profile.stars+=stars;
    T.phase='break';T.total=S.profile.brk*60;T.remaining=T.total;
    ui.say='Bir tur daha bitti. Şimdi hak ettiğin mola.';
    confetti();checkBadges();save();render();
    openSheet('celebrate',{title:'Tur tamam',text:min+' dakika '+(T.course?courseName(T.course)+' çalıştın.':'çalıştın.')+' Şimdi '+S.profile.brk+' dakika mola.',stars,btn:'Molaya geç'});
  }else{
    T.phase='focus';T.total=S.profile.focus*60;T.remaining=T.total;
    ui.say='Mola bitti. Hazır olunca yeni bir tur başlatalım.';
    save();render();
    openSheet('celebrate',{title:'Mola bitti',text:'Yeni bir odak turuna hazır mısın?',stars:0,btn:'Tamam'});
  }
}
setInterval(()=>{
  const T=S.timer;if(!T.running)return;
  const rem=Math.ceil((T.endAt-Date.now())/1000);
  if(rem<=0){T.remaining=0;tickDom();finishTimer();return;}
  if(rem!==T.remaining){T.remaining=rem;tickDom();}
},500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();}});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)closeSheet();});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
try{if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}catch(e){}
render();
</script>
</body>
</html>
